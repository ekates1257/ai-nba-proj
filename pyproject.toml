[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-predictor"
version = "0.1.0"
description = "Cloud-native NBA sophomore stat prediction API scaffold."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "joblib>=1.4,<2.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<3.0",
    "pydantic>=2.9,<3.0",
    "scikit-learn>=1.5,<2.0",
    "tensorflow>=2.16,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

